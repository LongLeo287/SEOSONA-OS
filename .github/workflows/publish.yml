name: Publish to NPM

on:
  release:
    types: [published]   # Trigger khi bạn tạo Release trên GitHub
  workflow_dispatch:      # Cho phép chạy thủ công từ tab Actions nếu cần

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Bundle SOUL.md into CLI assets
        working-directory: ./cli
        run: node scripts/bundle-soul.js

      - name: Verify package contents (dry-run)
        working-directory: ./cli
        run: npm pack --dry-run

      - name: Publish to NPM
        working-directory: ./cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
