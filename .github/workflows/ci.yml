name: CI

# Fast, first-party checks on every push/PR — the gate that would have caught the CLI-syntax
# regression. Scans only the OS's own code (lint + bridge + syntax + tests); it does NOT run CodeQL
# over the vendored skill/knowledge tree (that was intentionally removed — wrong fit for this repo).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # node --test glob patterns need >= 21 (the hooks test script uses one)
          cache: 'npm'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install
        run: npm ci

      - name: Lint — English-only policy
        run: npm run lint

      - name: Capability bridge validates
        run: node 1_CORE/scripts/seosona_capability_bridge.js validate

      - name: JS syntax — CLI must load
        run: node --check cli/src/localInit.js && node --check cli/bin/seosona.js

      - name: Python compiles
        run: python -m compileall -q 1_CORE/scripts

      - name: Hooks unit tests
        run: npm test

      - name: Security-critical Python tests
        # Install the REAL dependency set, not just pytest. With sklearn/pandas absent, the brain
        # test `importorskip`ed itself and the whole retrieval + pipeline surface went unexercised —
        # a green build meant only "the files parse". Every CRITICAL finding in the 2026-08-04 audit
        # would have surfaced on the first run of a CI that actually ran the code.
        run: pip install --quiet -r requirements.txt && python -m pytest tests/ -q

      - name: Knowledge brain answers with the real backend
        run: |
          python 1_CORE/scripts/mcp_knowledge_server.py --query "technical seo audit" > brain.json
          python -c "import json,sys; d=json.load(open('brain.json')); \
            assert d['backend'] == 'hybrid_bm25_tfidf', f'degraded backend: {d[\"backend\"]} — {d.get(\"warning\")}'; \
            assert d['results'], 'brain returned no results for a corpus term'; \
            print(f'brain OK: {len(d[\"results\"])} results via {d[\"backend\"]}')"

      - name: Router regeneration is deterministic
        run: |
          python 1_CORE/scripts/core/plugin_manager.py > /dev/null
          git diff --exit-code --stat 2_KNOWLEDGE/SKILLS_ROUTER.md \
            || (echo "SKILLS_ROUTER.md is not reproducible from source — regenerate and commit." && exit 1)
