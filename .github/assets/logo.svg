<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <linearGradient id="gradSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E2E2" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <style>
      .main-title { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900; 
        font-size: 85px; 
        fill: url(#gradText); 
        text-anchor: middle; 
        dominant-baseline: middle; 
        letter-spacing: 4px;
        filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.4));
      }
      .sub-title { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600; 
        font-size: 20px; 
        fill: url(#gradSub); 
        text-anchor: middle; 
        dominant-baseline: middle; 
        letter-spacing: 6px; 
        text-transform: uppercase; 
        opacity: 0.8;
      }
      .bg-rect {
        fill: #0d1117;
        rx: 15px;
      }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg-rect" />
  <text x="400" y="90" class="main-title">SEOSONA OS</text>
  <text x="400" y="160" class="sub-title">Universal AI Environment</text>
</svg>
