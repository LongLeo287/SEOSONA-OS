name: "SEOSONA OS — scan the OS's own code only"

# CodeQL should analyze the code SEOSONA OS actually authors — not the third-party skills, ingested
# frameworks, or research repos vendored into the tree for reference. We use paths-ignore (a denylist)
# rather than paths (an allowlist): paths-ignore keeps the matrix languages (python, javascript-
# typescript) and simply filters out vendored files, so it never triggers analysis of a language that
# only exists in vendored code (e.g. the Ruby files under .agents/skills/google-docs-skill).
paths-ignore:
  - ".agents"
  - "2_KNOWLEDGE"
  - "3_MEMORY"
  - "5_RESEARCH"
  - "cli/assets"
  - "**/node_modules"
  - "**/dist"
  - "**/tests"
