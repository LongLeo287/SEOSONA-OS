app = 'relay-avnuia'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VAULT_PROXY_URL = "https://vault-prod-21st.fly.dev"

[env]
  VAULT_PROXY_URL = "https://vault-prod-21st.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
