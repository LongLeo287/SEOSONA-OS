fullnameOverride: "opensandbox-controller"
namespaceOverride: "opensandbox-system"

controller:
  replicaCount: 1
  logLevel: info
  nodeSelector:
    workload: general
    opensandbox-role: reference
  tolerations: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
