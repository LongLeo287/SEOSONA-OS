apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-image-builder
  namespace: opensandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-image-builder-control
  namespace: opensandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-image-builder-control
  namespace: opensandbox
subjects:
  - kind: Group
    name: opensandbox-image-builder-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-image-builder-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-image-builder-job
  namespace: opensandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-image-builder-job
  namespace: opensandbox
subjects:
  - kind: ServiceAccount
    name: opensandbox-image-builder
    namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-image-builder-job
