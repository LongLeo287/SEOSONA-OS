  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"max-width:1180px; margin:0 auto; padding:clamp(56px,7vw,96px) 24px 0\">\n      <div class=\"os-rv\" style=\"border:1px solid #2A1F45; background:#120C22; border-radius:10px; overflow:hidden\">\n        <div style=\"padding:20px 24px; border-bottom:1px solid #2A1F45; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:baseline\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#E0BC4A; margin-bottom:6px\">MCP Server<\u002Fdiv>\n            <h2 style=\"font-size:20px; font-weight:800; margin:0; letter-spacing:-.02em\">Hỏi bằng câu tự nhiên, không phải nhớ đường dẫn<\u002Fh2>\n          <\u002Fdiv>\n          <span style=\"display:inline-flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#7DD3FC; border:1px solid #2A1F45; padding:4px 10px; border-radius:9999px\">\n            <span data-loop=\"1\" style=\"width:6px; height:6px; border-radius:50%; background:#7DD3FC; animation:osBlink 2.2s ease-in-out infinite\"><\u002Fspan>THỬ NGHIỆM\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:22px 24px; display:flex; flex-direction:column; gap:11px\">\n          <sc-for list=\"{{ queries }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; align-items:start\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#C9A227; flex:none; margin-top:2px\">?<\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14.5px; color:#F4F1FA; margin-bottom:4px; text-wrap:pretty\">{{ q.q }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#8B81A6; overflow-wrap:anywhere\">→ {{ q.a }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"gioi-han\" style=\"max-width:1180px; margin:0 auto; padding:clamp(56px,7vw,96px) 24px 0; scroll-margin-top:80px\">\n      <div class=\"os-rv\" style=\"max-width:64ch; margin-bottom:30px\">\n        <div style=\"display:flex; align-items:center; gap:11px; margin-bottom:14px\">\n          <span style=\"width:26px; height:2px; background:#7DD3FC\"><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#7DD3FC\">Giới hạn<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size:clamp(25px,3.6vw,38px); font-weight:800; letter-spacing:-.028em; line-height:1.18; margin:0 0 13px; text-wrap:pretty\">Bốn điều nó chưa làm được<\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.66; color:#B4AACB; margin:0; text-wrap:pretty\">Một hệ nói về nguồn chân lý duy nhất thì phải là chỗ nói thật trước nhất.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr)); gap:12px\">\n        <sc-for list=\"{{ limits }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div class=\"os-rv\" style=\"border:1px solid #2A1F45; border-left:2px solid #7DD3FC; background:#160F29; border-radius:10px; padding:19px\">\n            <h3 style=\"font-size:15px; font-weight:700; margin:0 0 8px; text-wrap:pretty\">{{ w.t }}<\u002Fh3>\n            <p style=\"font-size:13.5px; line-height:1.62; color:#B4AACB; margin:0; text-wrap:pretty\">{{ w.b }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"faq\" style=\"max-width:1180px; margin:0 auto; padding:clamp(56px,7vw,96px) 24px 0; scroll-margin-top:80px\">\n      <div class=\"os-rv\" style=\"max-width:64ch; margin-bottom:30px\">\n        <div style=\"display:flex; align-items:center; gap:11px; margin-bottom:14px\">\n          <span style=\"width:26px; height:2px; background:#C9A227\"><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#E0BC4A\">FAQ<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size:clamp(25px,3.6vw,38px); font-weight:800; letter-spacing:-.028em; line-height:1.18; margin:0; text-wrap:pretty\">Câu hỏi thường gặp<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:9px; max-width:820px\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n          <div class=\"os-rv\" style=\"border:1px solid {{ q.bd }}; background:#160F29; border-radius:10px; transition:border-color 150ms cubic-bezier(.16,1,.3,1)\">\n            <h3 style=\"margin:0\">\n              <button type=\"button\" sc-camel-on-click=\"{{ q.onToggle }}\" aria-expanded=\"{{ q.open }}\" style=\"width:100%; background:transparent; border:none; text-align:left; display:flex; gap:15px; align-items:center; justify-content:space-between; padding:16px 19px; min-height:48px; cursor:pointer; font-family:'Lexend',sans-serif; font-size:15px; font-weight:600; color:#F4F1FA\">\n                <span style=\"text-wrap:pretty\">{{ q.q }}<\u002Fspan>\n                <span aria-hidden=\"true\" style=\"font-family:'JetBrains Mono',monospace; font-size:17px; color:#E0BC4A; flex:none; transform:rotate({{ q.deg }}); transition:transform 220ms cubic-bezier(.16,1,.3,1)\">+<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fh3>\n            <div style=\"display:grid; grid-template-rows:{{ q.rows }}\">\n              <div style=\"overflow:hidden\">\n                <p style=\"font-size:14px; line-height:1.68; color:#B4AACB; margin:0; padding:0 19px 18px; text-wrap:pretty\">{{ q.a }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1180px; margin:0 auto; padding:clamp(56px,7vw,90px) 24px clamp(56px,7vw,96px)\">\n      <div class=\"os-rv\" style=\"border:1px solid #2A1F45; background:#120C22; border-radius:10px; padding:clamp(26px,4vw,44px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); gap:30px; align-items:center\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#E0BC4A; margin-bottom:13px\">Dùng thử<\u002Fdiv>\n          <h2 style=\"font-size:clamp(22px,3vw,31px); font-weight:800; letter-spacing:-.028em; line-height:1.2; margin:0 0 12px; text-wrap:pretty\">Nhận một bản doctrine mẫu<\u002Fh2>\n          <p style=\"font-size:15px; line-height:1.64; color:#B4AACB; margin:0\">Một file quy chuẩn gốc để thử tiêm vào IDE của bạn, kèm hướng dẫn nối MCP và bảng ba tầng trí nhớ.<\u002Fp>\n        <\u002Fdiv>\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex; flex-direction:column; gap:11px\">\n          <div>\n            <label for=\"os-email\" style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#8B81A6; margin-bottom:7px\">Email nhận bản mẫu<\u002Flabel>\n            <input id=\"os-email\" type=\"email\" required=\"\" placeholder=\"ban@congty.vn\" style=\"width:100%; box-sizing:border-box; background:#0A0714; border:1px solid #2A1F45; border-radius:4px; color:#F4F1FA; font-family:'Lexend',sans-serif; font-size:14px; padding:13px 14px; min-height:48px; outline:none; transition:border-color 150ms cubic-bezier(.16,1,.3,1), box-shadow 150ms cubic-bezier(.16,1,.3,1)\" style-focus=\"border-color:#C9A227; box-shadow:0 0 0 3px rgba(201,162,39,.3)\">\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"border:none; background:#C9A227; color:#0A0714; font-family:'Lexend',sans-serif; font-size:15px; font-weight:700; padding:14px 26px; min-height:48px; border-radius:9999px; cursor:pointer; transition:transform 220ms cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:translateY(-2px)\">Gửi cho tôi<\u002Fbutton>\n          <p aria-live=\"polite\" style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:{{ sentColor }}; margin:0; min-height:17px\">{{ sentMsg }}<\u002Fp>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid #2A1F45; background:#06040E; padding:40px 0 36px\">\n    <div style=\"max-width:1180px; margin:0 auto; padding:0 24px; display:flex; flex-wrap:wrap; gap:22px; justify-content:space-between; align-items:flex-end\">\n      <div>\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:9px\">\n          <span style=\"width:22px; height:22px; border-radius:4px; background:#C9A227; color:#0A0714; display:grid; place-items:center; font-size:12px; font-weight:800\">◎<\u002Fspan>\n          <span style=\"font-size:15px; font-weight:800\">SEOSONA OS<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#8B81A6; margin:0\">Bộ não trung tâm · hệ điều hành tri thức hướng tâm<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:18px\">\n        <a href=\"https://github.com/LongLeo287/SEOSONA-OS\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13.5px; font-weight:600; color:#B4AACB\" style-hover=\"color:#E0BC4A\">GitHub ↗<\u002Fa>\n        <a href=\"https://portfolio-long-leo.vercel.app\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13.5px; font-weight:600; color:#B4AACB\" style-hover=\"color:#E0BC4A\">Portfolio ↗<\u002Fa>\n        <a href=\"Design System 8 Landing Page.dc.html\" style=\"font-size:13.5px; font-weight:600; color:#B4AACB\" style-hover=\"color:#E0BC4A\">Design System ←<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9A227&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#C9A227&quot;,&quot;#D4A857&quot;,&quot;#B8912A&quot;,&quot;#E0BC4A&quot;],&quot;section&quot;:&quot;Nhận diện&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { lang: 'vi', faq: -1, sent: '' };\n  }\n\n  componentDidMount() {\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let pending = false, tx = 0;\n    this._move = (e) => {\n      const el = this._tilt || (this._tilt = document.querySelector('[data-tilt]'));\n      if (!el || reduce) return;\n      const r = el.getBoundingClientRect();\n      if (r.bottom < 0 || r.top > window.innerHeight) return;\n      tx = ((e.clientX - r.left) / r.width - 0.5) * 16;\n      if (pending) return;\n      pending = true;\n      const run = () => {\n        pending = false;\n        if (this._tilt) this._tilt.style.setProperty('--os-tilt', tx.toFixed(2) + 'deg');\n      };\n      if (document.hidden) setTimeout(run, 0); else requestAnimationFrame(run);\n    };\n    window.addEventListener('pointermove', this._move, { passive: true });\n\n    const items = Array.from(document.querySelectorAll('.os-rv'));\n    const show = (el) => el.classList.add('os-in');\n    if (!('IntersectionObserver' in window) || reduce) { items.forEach(show); return; }\n    const io = new IntersectionObserver((es) => {\n      es.forEach((e) => {\n        if (!e.isIntersecting) return;\n        io.unobserve(e.target);\n        const sibs = e.target.parentElement ? Array.from(e.target.parentElement.children).filter((n) => n.classList.contains('os-rv')) : [e.target];\n        setTimeout(() => show(e.target), Math.min(sibs.indexOf(e.target), 5) * 90);\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n    items.forEach((el) => io.observe(el));\n    this._io = io;\n    this._fail = setTimeout(() => items.forEach(show), 2600);\n  }\n\n  componentWillUnmount() {\n    if (this._move) window.removeEventListener('pointermove', this._move);\n    if (this._io) this._io.disconnect();\n    if (this._fail) clearTimeout(this._fail);\n  }\n\n  renderVals() {\n    const A = this.props.accent ?? '#C9A227';\n    const vi = this.state.lang === 'vi';\n\n    const benefits = [\n      { t: 'Không phải dạy lại từng IDE', b: 'Một bản doctrine tiêm vào cả năm công cụ. Viết một lần, và không có bản nào lệch khỏi bản nào sau vài tháng.' },\n      { t: 'Ngữ cảnh không bị xoá sạch', b: 'Bộ nhớ dự án sống qua nhiều phiên làm việc. Mở lại hôm sau không phải kể lại từ đầu.' },\n      { t: 'Tra tri thức bằng câu hỏi', b: 'Hỏi MCP bằng tiếng người thay vì phải nhớ chính xác tên file và đường dẫn trong hơn hai nghìn tài liệu.' }\n    ];\n\n    const orbitOuter = [{ a: '0deg' }, { a: '72deg' }, { a: '144deg' }, { a: '216deg' }, { a: '288deg' }];\n\n    const tools = [\n      { n: 'Claude Code', k: 'CLI' }, { n: 'Cursor', k: 'IDE' }, { n: 'Codex', k: 'IDE' },\n      { n: 'Windsurf', k: 'IDE' }, { n: 'Aider', k: 'CLI' }\n    ];\n    const sats = [\n      { n: 'SEOSONA Flow', k: 'extension' }, { n: 'SEOSONA Video AI', k: 'pipeline' },\n      { n: 'SEOSONA UX-UI', k: 'design system' }, { n: 'OmniClaw', k: 'daemon' }\n    ];\n\n    const tiers = [\n      { t: 'Tầng 1 · Lõi quy tắc', rate: 'gần như không đổi', c: '#7DD3FC', b: 'Bộ luật toàn cục và cấu hình gốc, tự động tiêm vào mọi công cụ khi mở phiên. Đây là thứ được phép ít thay đổi nhất.' },\n      { t: 'Tầng 2 · Kho tri thức', rate: 'đổi theo tuần', c: A, b: 'Tài liệu chuyên sâu đã phân tích và lập chỉ mục, mở ra qua MCP để tra bằng ngữ nghĩa thay vì bằng tên file.' },\n      { t: 'Tầng 3 · Bộ nhớ dự án', rate: 'đổi theo phiên', c: '#B4AACB', b: 'Ngữ cảnh dài hạn của từng dự án, giữ liên
